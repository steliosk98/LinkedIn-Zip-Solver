<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn ZIP Solver</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="hero">
        <p class="eyebrow">LinkedIn ZIP Solver</p>
        <h1>Draw the route, then replay it.</h1>
        <p class="subcopy">Choose a board size, draw one route, then lock it for replay.</p>
      </header>

      <section class="panel">
        <div class="panel-header">
          <div>
            <h2>Path</h2>
            <p class="panel-copy">Arm the canvas, choose a start cell, then drag across the grid.</p>
          </div>
          <span id="statusBadge" class="badge">No path</span>
        </div>

        <button id="captureArea" class="capture-area" type="button" aria-describedby="moveSummary">
          <span class="capture-title">Path Capture</span>
          <span class="capture-copy">Click to arm drawing mode for the grid below</span>
        </button>

        <p id="moveSummary" class="summary">0 moves recorded.</p>

        <label class="size-picker" for="gridSizeSelect">
          <span>Grid size</span>
          <div class="size-inputs">
            <select id="gridSizeSelect">
              <option value="5">5x5</option>
              <option value="7">7x7</option>
              <option value="9">9x9</option>
              <option value="11">11x11</option>
              <option value="custom">Custom</option>
            </select>
            <label class="custom-size" for="gridSizeCustom">
              <span>Custom</span>
              <input id="gridSizeCustom" type="number" min="3" max="25" step="1" inputmode="numeric" placeholder="13">
            </label>
          </div>
        </label>

        <div class="canvas-wrap">
          <canvas id="pathCanvas" width="330" height="330" aria-label="Path preview"></canvas>
        </div>

        <div class="controls">
          <button id="clearButton" class="secondary" type="button">Clear</button>
          <button id="lockButton" class="primary" type="button">Path Drawn</button>
          <button id="unlockButton" class="secondary" type="button">Unlock</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div>
            <h2>Solve</h2>
            <p class="panel-copy">Replay the locked path on the current active browser tab.</p>
          </div>
        </div>

        <button id="solveButton" class="solve-button" type="button">Solve</button>
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
